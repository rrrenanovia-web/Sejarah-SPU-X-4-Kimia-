const Q=[["Dalam pengembangan teknologi baterai, para peneliti mempelajari karakteristik berbagai unsur logam alkali tanah. Unsur-unsur dalam golongan IIA memiliki dua elektron valensi yang dapat berperan dalam pembentukan ikatan kimia. Namun, tidak semua unsur dalam golongan tersebut memiliki tingkat kesulitan yang sama ketika elektronnya dilepaskan. Seorang siswa melakukan kajian terhadap unsur Be, Mg, Ca, Sr, dan Ba. Ia menemukan bahwa ketika bergerak dari atas ke bawah dalam golongan, jumlah kulit elektron bertambah. Elektron terluar semakin jauh dari inti atom dan pengaruh shielding oleh elektron-elektron di kulit dalam semakin besar. Kondisi tersebut memengaruhi energi yang diperlukan untuk melepaskan elektron terluar. Berdasarkan fenomena tersebut, unsur yang diperkirakan memiliki energi ionisasi paling besar adalah ...", ["Ca", "Sr", "Ba", "Be", "Mg"], 3], ["Pada abad ke-19, para ilmuwan mulai berusaha mengelompokkan unsur berdasarkan keteraturan sifatnya. John Newlands menyusun unsur-unsur berdasarkan kenaikan massa atom relatif. Ia menemukan bahwa unsur tertentu menunjukkan kemiripan sifat setelah selang tujuh unsur, sehingga unsur kedelapan memiliki karakteristik yang menyerupai unsur pertama dalam pola tersebut. Gagasan ini dikenal sebagai Hukum Oktaf. Newlands menganggap pola pengulangan tersebut dapat diterapkan pada unsur-unsur yang telah dikenal pada masanya. Akan tetapi, ketika jumlah unsur yang disusun semakin banyak, pola pengulangan sifat setiap unsur kedelapan tidak selalu sesuai dengan karakteristik unsur yang ditemukan. Beberapa unsur yang memiliki sifat berbeda justru berada dalam pola yang sama, sedangkan unsur yang memiliki kemiripan sifat tidak selalu berada pada posisi yang sesuai. Berdasarkan informasi tersebut, penyebab utama keterbatasan Hukum Oktaf Newlands adalah ...", ["Newlands menyusun unsur berdasarkan nomor atom, bukan massa atom.", "Pola pengulangan sifat setiap delapan unsur tidak berlaku secara universal untuk seluruh unsur.", "Newlands tidak mengamati adanya hubungan antara sifat unsur dan massa atom.", "Semua unsur pada masa Newlands memiliki massa atom yang sama.", "Unsur-unsur tidak memiliki keteraturan sifat berdasarkan massa atom."], 1], ["Dalam upaya memahami keteraturan sifat unsur, Julius Lothar Meyer melakukan penelitian dengan menghubungkan massa atom dengan volume atom. Ia menyusun data sejumlah unsur dan menggambarkan hubungan kedua besaran tersebut dalam bentuk grafik. Dari grafik yang dihasilkan, terdapat pola naik dan turun yang berulang. Beberapa unsur seperti litium, natrium, kalium, rubidium, dan sesium menunjukkan posisi pada bagian puncak grafik yang memiliki pola serupa. Penelitian tersebut menunjukkan bahwa sifat fisik unsur tidak berubah secara acak. Meskipun massa atom meningkat, terdapat kecenderungan sifat tertentu yang muncul kembali pada unsur-unsur berikutnya. Pola tersebut menjadi salah satu bukti bahwa unsur memiliki keteraturan sifat yang bersifat periodik. Berdasarkan hasil penelitian Meyer, alasan ilmiah yang paling tepat untuk mendukung keteraturan sifat unsur adalah ...", ["Unsur dengan massa atom yang sama selalu memiliki volume atom yang sama.", "Volume atom seluruh unsur mengalami kenaikan secara konstan.", "Hubungan massa atom dan volume atom menunjukkan pola sifat fisik yang berulang secara periodik.", "Unsur yang memiliki volume atom terbesar selalu mempunyai sifat kimia identik.", "Grafik Meyer membuktikan bahwa seluruh unsur memiliki jumlah elektron valensi yang sama."], 2], ["Ketika menyusun tabel periodik, Dmitri Mendeleev berusaha mengelompokkan unsur berdasarkan kenaikan massa atom relatif dan kemiripan sifat kimia. Ia menemukan bahwa beberapa unsur memiliki pola sifat yang berulang. Namun, tidak semua unsur yang telah diketahui pada saat itu dapat ditempatkan secara langsung tanpa mengganggu keteraturan sifat dalam tabel. Mendeleev kemudian mengambil keputusan untuk meninggalkan beberapa ruang kosong pada tabel periodiknya. Ia meyakini bahwa ruang tersebut bukanlah kesalahan penyusunan, melainkan kemungkinan tempat bagi unsur-unsur yang belum ditemukan. Berdasarkan pola unsur yang berada di sekitar ruang kosong tersebut, Mendeleev bahkan memperkirakan karakteristik unsur yang belum diketahui. Keputusan Mendeleev tersebut menunjukkan bahwa ...", ["Unsur yang belum ditemukan tidak memiliki sifat kimia tertentu.", "Penyusunan unsur hanya didasarkan pada kenaikan massa atom tanpa mempertimbangkan sifat kimia.", "Keteraturan sifat unsur dapat digunakan untuk memprediksi keberadaan dan karakteristik unsur yang belum ditemukan.", "Semua unsur yang belum ditemukan memiliki massa atom yang sama.", "Mendeleev menggunakan nomor atom sebagai dasar utama penyusunan unsur."], 2], ["Sistem periodik Mendeleev disusun dengan mempertimbangkan kenaikan massa atom relatif dan kemiripan sifat unsur. Namun, terdapat beberapa kasus yang menunjukkan bahwa urutan massa atom tidak selalu sesuai dengan urutan penempatan unsur dalam tabel. Salah satu kasus yang menarik adalah argon dan kalium. Argon memiliki massa atom relatif sekitar 39,9, sedangkan kalium memiliki massa atom relatif sekitar 39,1. Jika penyusunan hanya didasarkan pada kenaikan massa atom relatif, kalium seharusnya ditempatkan sebelum argon. Namun, argon tetap ditempatkan sebelum kalium karena karakteristik kimia argon lebih sesuai dengan kelompok gas mulia, sedangkan kalium memiliki karakteristik logam alkali. Berdasarkan kasus tersebut, alasan paling tepat Mendeleev mempertahankan posisi kedua unsur adalah ...", ["Mendeleev mengabaikan massa atom karena tidak memiliki data pengukuran.", "Mendeleev lebih mengutamakan kesesuaian sifat kimia unsur daripada urutan massa atom secara mutlak.", "Argon memiliki nomor atom lebih kecil daripada kalium.", "Argon dan kalium memiliki sifat kimia yang sama.", "Massa atom relatif tidak dapat digunakan dalam pengelompokan unsur."], 1], ["Sistem periodik Mendeleev menjadi salah satu tonggak penting dalam perkembangan ilmu kimia. Namun, sistem tersebut masih memiliki keterbatasan karena dasar penyusunannya menggunakan massa atom relatif. Beberapa unsur menunjukkan ketidaksesuaian apabila disusun hanya berdasarkan kenaikan massa atom. Kasus argon dan kalium menunjukkan bahwa argon memiliki massa atom relatif lebih besar daripada kalium, tetapi ditempatkan lebih dahulu. Kasus serupa juga ditemukan pada kobalt dan nikel, yang menunjukkan bahwa urutan massa atom tidak selalu menghasilkan pengelompokan yang sesuai dengan karakteristik unsur. Jika kedua kasus tersebut dianalisis secara bersamaan, kesimpulan yang paling tepat mengenai kelemahan sistem periodik Mendeleev adalah ...", ["Pengelompokan berdasarkan massa atom belum sepenuhnya mampu menghasilkan urutan unsur yang konsisten dengan keteraturan sifatnya.", "Semua unsur transisi tidak dapat dikelompokkan berdasarkan kemiripan sifat.", "Sistem periodik Mendeleev hanya dapat digunakan untuk mengelompokkan unsur nonlogam.", "Kemiripan sifat unsur tidak memiliki hubungan dengan posisi unsur dalam tabel periodik.", "Unsur-unsur dengan massa atom relatif berdekatan pasti memiliki sifat kimia yang sama."], 0], ["Pada awal abad ke-20, Henry Moseley melakukan penelitian menggunakan sinar-X yang dihasilkan oleh berbagai unsur. Melalui penelitian tersebut, ia menemukan hubungan antara karakteristik sinar-X dan jumlah proton dalam inti atom. Hasil penelitian ini menunjukkan bahwa keteraturan unsur lebih tepat dijelaskan berdasarkan nomor atom daripada massa atom relatif. Penemuan tersebut membantu menjelaskan ketidaksesuaian yang ditemukan dalam sistem periodik sebelumnya. Unsur yang memiliki massa atom relatif tidak sesuai dengan urutan tabel ternyata dapat ditempatkan dengan lebih tepat apabila penyusunan didasarkan pada jumlah proton dalam inti atom. Berdasarkan hasil penelitian Moseley, dasar penyusunan sistem periodik modern yang paling tepat adalah ...", ["Massa atom relatif dan volume atom.", "Kemiripan warna dan wujud unsur.", "Nomor atom sebagai dasar penyusunan unsur secara berurutan.", "Massa jenis dan titik didih unsur.", "Jumlah isotop yang dimiliki setiap unsur."], 2], ["Dalam sebuah pembelajaran kimia, peserta didik diminta membuat laporan mengenai perkembangan sistem periodik unsur. Mereka mempelajari kontribusi beberapa ilmuwan, mulai dari Döbereiner, Newlands, Meyer, Mendeleev, hingga Moseley. Döbereiner mengelompokkan unsur berdasarkan kemiripan sifat dalam kelompok tiga unsur. Newlands menemukan pola pengulangan sifat setelah unsur kedelapan. Meyer menunjukkan keteraturan sifat fisik melalui hubungan massa atom dan volume atom. Mendeleev menyusun unsur berdasarkan massa atom dan kemiripan sifat serta menyediakan ruang kosong untuk unsur yang belum ditemukan. Moseley kemudian menunjukkan bahwa nomor atom menjadi dasar yang lebih tepat untuk menyusun unsur. Kelompok peserta didik menyimpulkan bahwa sistem periodik modern merupakan hasil penyempurnaan pemikiran ilmiah dari berbagai penelitian sebelumnya. Evaluasi yang paling tepat terhadap kesimpulan tersebut adalah ...", ["Tidak tepat, karena seluruh ilmuwan menggunakan dasar penyusunan yang sama.", "Tidak tepat, karena Moseley hanya mengembangkan Hukum Oktaf Newlands.", "Tepat, karena perkembangan sistem periodik menunjukkan proses penyempurnaan pemahaman terhadap keteraturan unsur dan perbaikan kelemahan sistem sebelumnya.", "Tidak tepat, karena Mendeleev sudah menggunakan nomor atom sebagai dasar penyusunan unsur.", "Tepat, karena seluruh ilmuwan mengelompokkan unsur berdasarkan volume atom yang sama."], 2], ["Dalam buku kimia yang berbeda, peserta didik dapat menemukan dua sistem penomoran golongan. Buku yang lebih lama menggunakan kombinasi angka Romawi dan huruf A/B, seperti IA, IIA, VIIA, dan VIIIB. Sementara itu, sistem yang direkomendasikan oleh IUPAC menggunakan angka 1 hingga 18. Ketika mempelajari kedua sistem tersebut, seorang siswa menganggap bahwa kedua penomoran tersebut menunjukkan tabel periodik yang berbeda. Ia berpendapat bahwa sistem lama tidak dapat digunakan apabila seseorang telah menggunakan sistem penomoran IUPAC. Berdasarkan pemahaman mengenai sistem penomoran golongan, penilaian yang paling tepat terhadap pendapat siswa tersebut adalah ...", ["Benar, karena kedua sistem memiliki susunan unsur yang berbeda secara keseluruhan.", "Benar, karena sistem lama hanya digunakan untuk unsur logam.", "Kurang tepat, karena kedua sistem merupakan sistem penomoran golongan yang berbeda dan dapat digunakan untuk mengidentifikasi posisi golongan dengan acuan masing-masing.", "Salah, karena sistem lama hanya digunakan sebelum penemuan unsur transisi.", "Salah, karena sistem penomoran baru menggunakan huruf A dan B sebagai pengganti angka."], 2], ["Sebuah kelompok peserta didik ditugaskan membuat rancangan poster perkembangan sistem periodik unsur. Mereka ingin menunjukkan bagaimana para ilmuwan mengembangkan sistem pengelompokan unsur berdasarkan hasil pengamatan dan penelitian. Dalam diskusi, kelompok tersebut mencatat beberapa prinsip: kemiripan sifat dan massa atom digunakan dalam pengelompokan awal; pola pengulangan sifat ditemukan melalui Hukum Oktaf; hubungan massa atom dan volume atom menunjukkan keteraturan periodik; Mendeleev memanfaatkan keteraturan sifat untuk memperkirakan unsur yang belum ditemukan; dan Moseley menunjukkan bahwa nomor atom menjadi dasar penyusunan sistem periodik modern. Kelompok tersebut kemudian harus menentukan rancangan yang paling mampu menggambarkan perkembangan pemikiran ilmiah tersebut. Rancangan yang paling tepat adalah ... Bagian II — Sifat Periodik Unsur", ["Menggunakan satu prinsip pengelompokan yang sama sejak Döbereiner hingga Moseley karena seluruh ilmuwan memiliki tujuan identik.", "Menggabungkan seluruh prinsip tanpa mempertimbangkan kelemahan masing-masing sistem pengelompokan.", "Menggambarkan perkembangan secara bertahap melalui kemiripan sifat, keteraturan periodik, prediksi unsur, dan nomor atom sebagai dasar penyusunan modern.", "Menggunakan Hukum Oktaf sebagai dasar utama karena mampu menjelaskan seluruh keteraturan unsur.", "Menggunakan massa atom sebagai satu-satunya dasar penyusunan karena telah digunakan oleh sebagian besar ilmuwan terdahulu."], 2], ["Dalam suatu penelitian sederhana, peserta didik mengamati tiga unsur yang berada pada periode ketiga tabel periodik, yaitu natrium, magnesium, dan aluminium. Ketiga unsur tersebut memiliki jumlah kulit elektron yang sama, yaitu tiga kulit. Namun, jumlah proton dalam inti atom ketiganya berbeda. Natrium memiliki 11 proton, magnesium memiliki 12 proton, dan aluminium memiliki 13 proton. Ketika jumlah proton semakin besar, tarikan inti terhadap elektron dalam kulit yang sama menjadi semakin kuat. Hal ini memengaruhi ukuran atom, meskipun jumlah kulit elektron ketiga unsur tersebut tetap sama. Berdasarkan fenomena tersebut, kecenderungan jari-jari atom dari natrium, magnesium, hingga aluminium adalah ...", ["Jari-jari atom semakin besar karena jumlah proton bertambah.", "Jari-jari atom semakin kecil karena tarikan inti terhadap elektron semakin kuat.", "Jari-jari atom tetap karena ketiganya memiliki jumlah kulit elektron yang sama.", "Jari-jari atom semakin besar karena jumlah elektron valensi bertambah.", "Jari-jari atom tidak dapat dibandingkan karena ketiganya merupakan unsur logam."], 1], ["Litium, natrium, dan kalium merupakan unsur yang berada dalam golongan IA. Ketiga unsur tersebut memiliki satu elektron valensi, tetapi jumlah kulit elektron berbeda. Litium memiliki dua kulit elektron, natrium memiliki tiga kulit elektron, sedangkan kalium memiliki empat kulit elektron. Penambahan kulit elektron menyebabkan elektron terluar berada semakin jauh dari inti atom. Selain itu, elektron-elektron pada kulit dalam memberikan efek shielding sehingga tarikan inti terhadap elektron terluar menjadi semakin berkurang. Berdasarkan informasi tersebut, urutan jari-jari atom dari terkecil hingga terbesar adalah ...", ["Li – Na – K", "K – Na – Li", "Na – Li – K", "Li – K – Na", "Na – K – Li"], 0], ["Dalam kehidupan sehari-hari, logam alkali dikenal memiliki kecenderungan untuk membentuk ion positif. Natrium dapat membentuk ion Na⁺, sedangkan kalium dapat membentuk ion K⁺. Pembentukan ion positif terjadi ketika atom melepaskan elektron terluarnya. Li, Na, dan K memiliki satu elektron valensi. Namun, ketiganya memiliki jumlah kulit elektron yang berbeda. Semakin banyak kulit elektron, elektron terluar semakin jauh dari inti dan semakin terlindungi oleh elektron-elektron pada kulit dalam. Kondisi tersebut memengaruhi energi yang diperlukan untuk melepaskan elektron. Jika ketiga unsur tersebut diberikan kondisi yang memungkinkan untuk melepaskan satu elektron, unsur yang paling mudah membentuk ion positif adalah ...", ["Li, karena memiliki jumlah kulit elektron paling sedikit.", "Na, karena memiliki jumlah proton lebih banyak daripada Li.", "K, karena elektron terluarnya berada pada kulit yang lebih jauh dari inti dan lebih mudah dilepaskan.", "Li, karena elektron valensinya paling dekat dengan inti atom.", "Ketiganya memiliki kemampuan melepaskan elektron yang sama karena jumlah elektron valensinya sama."], 2], ["Peserta didik melakukan pengamatan terhadap unsur-unsur dalam golongan IA dan IIA. Mereka menemukan bahwa unsur-unsur dalam satu golongan memiliki kemiripan karakteristik kimia. Namun, beberapa sifat fisik dan kimia mengalami perubahan ketika posisi unsur bergerak dari atas ke bawah. Perubahan tersebut berkaitan dengan bertambahnya jumlah kulit elektron, meningkatnya shielding, serta perubahan jarak elektron terluar dari inti atom. Ketiga faktor tersebut menyebabkan perubahan kekuatan tarikan inti terhadap elektron terluar. Berdasarkan kecenderungan sifat periodik dalam satu golongan dari atas ke bawah, pernyataan yang paling tepat adalah ...", ["Jari-jari atom berkurang.", "Energi ionisasi meningkat.", "Keelektronegatifan selalu meningkat.", "Energi ionisasi cenderung berkurang.", "Jumlah kulit elektron tetap."], 3], ["Dalam proses pembentukan senyawa, beberapa unsur memiliki kecenderungan untuk menerima atau menarik elektron dari unsur lain. Unsur-unsur yang berada di bagian kanan tabel periodik, terutama unsur nonlogam, umumnya memiliki kecenderungan yang lebih kuat untuk menarik elektron dalam suatu ikatan dibandingkan unsur-unsur logam yang berada di bagian kiri. Seorang siswa membandingkan dua unsur yang berada dalam periode ketiga. Unsur X berada pada golongan IA, sedangkan unsur Y berada pada golongan VIIA. Keduanya memiliki jumlah kulit elektron yang sama, tetapi karakteristik kimianya berbeda. X cenderung melepaskan elektron, sedangkan Y cenderung menerima elektron. Penjelasan yang paling tepat untuk kecenderungan Y menarik elektron lebih kuat adalah ...", ["X memiliki energi ionisasi lebih besar daripada Y sehingga lebih mudah melepaskan elektron.", "Y memiliki keelektronegatifan yang lebih besar sehingga cenderung menarik elektron lebih kuat.", "X memiliki keelektronegatifan lebih besar sehingga mudah membentuk ion positif.", "Y memiliki jari-jari atom lebih besar sehingga lebih mudah menarik elektron.", "X dan Y memiliki sifat kimia yang sama karena berada dalam satu periode."], 1], ["Natrium, magnesium, dan aluminium merupakan unsur logam yang berada dalam periode ketiga. Ketiganya memiliki kemampuan menghantarkan listrik dan panas. Namun, karakteristik sifat logam menunjukkan kecenderungan berkurang ketika bergerak dari kiri ke kanan dalam satu periode. Hal tersebut berkaitan dengan perubahan jumlah proton dalam inti atom, sedangkan jumlah kulit elektron tetap. Semakin besar jumlah proton, tarikan inti terhadap elektron semakin kuat. Akibatnya, elektron semakin sulit dilepaskan dibandingkan unsur yang berada lebih ke kiri dalam periode yang sama. Alasan paling tepat yang menjelaskan kecenderungan berkurangnya sifat logam dari natrium menuju aluminium adalah ...", ["Jari-jari atom semakin besar sehingga elektron semakin mudah dilepaskan.", "Tarikan inti terhadap elektron semakin kuat sehingga elektron semakin sulit dilepaskan.", "Jumlah kulit elektron semakin bertambah sehingga sifat logam semakin berkurang.", "Jumlah elektron valensi semakin sedikit sehingga kemampuan menghantarkan listrik menurun.", "Jumlah proton semakin berkurang sehingga atom semakin sulit membentuk ion positif."], 1], ["Seorang peneliti sedang mempelajari suatu unsur yang belum diketahui secara pasti posisinya dalam tabel periodik. Berdasarkan hasil analisis, unsur tersebut memiliki jari-jari atom relatif besar dibandingkan unsur lain dalam periode yang sama. Unsur tersebut juga memiliki energi ionisasi relatif rendah dan cenderung melepaskan elektron ketika berinteraksi dengan unsur lain. Peneliti menduga bahwa unsur tersebut memiliki karakteristik logam yang kuat. Ia kemudian menggunakan kecenderungan sifat periodik untuk menentukan lokasi unsur yang paling mungkin dalam tabel periodik. Berdasarkan karakteristik tersebut, posisi unsur yang paling mungkin adalah ...", ["Bagian kiri bawah tabel periodik.", "Bagian kanan atas tabel periodik.", "Bagian kanan bawah tabel periodik.", "Bagian kiri atas tabel periodik.", "Bagian tengah atas tabel periodik."], 0], ["Dalam suatu kegiatan analisis data kimia, peserta didik mengamati titik leleh dan titik didih unsur-unsur periode ketiga. Mereka menemukan bahwa kecenderungan kedua sifat tersebut tidak menunjukkan peningkatan secara terus-menerus dari kiri ke kanan. Beberapa unsur memiliki titik leleh dan titik didih relatif tinggi, sementara unsur lain menunjukkan nilai yang jauh lebih rendah. Seorang siswa kemudian menyatakan bahwa jumlah proton yang semakin bertambah dalam satu periode seharusnya menyebabkan titik leleh dan titik didih selalu meningkat. Guru meminta peserta didik mengevaluasi pernyataan tersebut dengan mempertimbangkan bahwa unsur-unsur memiliki struktur dan jenis ikatan yang berbeda. Evaluasi yang paling tepat terhadap pernyataan siswa adalah ...", ["Benar, karena semakin banyak proton selalu menyebabkan titik leleh dan titik didih meningkat.", "Benar, karena seluruh unsur dalam satu periode memiliki ikatan kimia yang sama.", "Salah, karena titik leleh dan titik didih dipengaruhi oleh struktur serta jenis ikatan, sehingga kecenderungannya tidak selalu meningkat secara monoton.", "Salah, karena titik leleh dan titik didih selalu menurun dari kiri ke kanan dalam satu periode.", "Benar, karena unsur golongan VIIIA memiliki titik leleh dan titik didih paling tinggi."], 2], ["Seorang siswa melakukan penelitian sederhana dengan membandingkan titik leleh dan titik didih unsur-unsur dalam golongan IA dan VIIA. Ia menemukan bahwa beberapa unsur dalam golongan IA menunjukkan kecenderungan penurunan titik leleh dan titik didih ketika bergerak ke bawah. Sementara itu, unsur-unsur halogen menunjukkan kecenderungan yang berbeda, yaitu peningkatan titik leleh dan titik didih dari atas ke bawah. Siswa kemudian mencoba menjelaskan perbedaan tersebut dengan mempertimbangkan karakteristik unsur dalam kedua golongan. Golongan IA merupakan logam yang memiliki ikatan logam, sedangkan golongan VIIA terdiri atas molekul diatomik yang interaksi antarmolekulnya memengaruhi titik leleh dan titik didih. Berdasarkan hasil penelitian tersebut, penilaian paling tepat terhadap kedua kecenderungan adalah ...", ["Kedua kesimpulan salah karena titik leleh dan titik didih selalu meningkat ke bawah.", "Kesimpulan pertama benar, sedangkan kesimpulan kedua salah karena keduanya memiliki pola yang sama.", "Kesimpulan pertama salah, sedangkan kesimpulan kedua benar karena golongan IA memiliki titik leleh lebih tinggi.", "Kedua kesimpulan dapat benar karena kecenderungan titik leleh dan titik didih pada golongan yang berbeda dipengaruhi karakteristik struktur dan ikatan masing-masing unsur.", "Kedua kesimpulan salah karena titik leleh dan titik didih tidak memiliki pola periodik."], 3], ["Dalam pembentukan ikatan kimia, elektron dapat dibagi bersama atau mengalami perpindahan antara atom-atom. let active=false,finished=false,remaining=2700,interval;
function start(){if(!nama.value.trim()||!kelas.value.trim()||!absen.value.trim()){alert("Lengkapi nama, kelas, dan nomor absen.");return}
intro.style.display="none";quiz.style.display="block";active=true;ident.textContent=`${nama.value} • ${kelas.value} • Absen ${absen.value}`;render();interval=setInterval(()=>{remaining--;updateTimer();if(remaining<=0)finish(true)},1000)}
function render(){questions.innerHTML=Q.map((q,i)=>`<section class="q"><h3>${i+1}. ${q[0]}</h3>${i===19?`<div style="overflow-x:auto;margin:14px 0"><table style="border-collapse:collapse;width:100%;max-width:500px;background:#fff;color:#111"><thead><tr><th style="border:1px solid #555;padding:10px">Unsur</th><th style="border:1px solid #555;padding:10px">Nilai keelektronegatifan</th></tr></thead><tbody>${[["J","1,2"],["K","3,0"],["L","2,5"],["M","3,5"],["N","4,0"]].map(r=>`<tr>${r.map(v=>`<td style="border:1px solid #555;padding:10px;text-align:center">${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:""}${q[1].map((a,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}"><span style="color:#111">${String.fromCharCode(65+j)}. ${a}</span></label>`).join("")}</section>`).join("")}
function updateTimer(){let m=Math.floor(remaining/60),s=remaining%60;timer.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function finish(auto){if(finished)return;finished=true;active=false;clearInterval(interval);let correct=0;Q.forEach((q,i)=>{let v=document.querySelector(`input[name=q${i}]:checked`);if(v&&Number(v.value)===q[2])correct++});let value=Math.round(10+(correct/20)*90);quiz.style.display="none";result.style.display="block";resultIdentity.textContent=`${nama.value} • ${kelas.value} • Absen ${absen.value}`;score.textContent=`Nilai: ${value}/100`;msg.textContent=auto?"Waktu pengerjaan berakhir otomatis karena timer habis atau terdeteksi keluar dari tab/jendela quiz.":"Jawaban berhasil dikumpulkan.";document.querySelectorAll("input").forEach(x=>x.disabled=true)}
